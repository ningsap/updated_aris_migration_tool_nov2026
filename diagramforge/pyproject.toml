[project]
name = "diagramforge"
version = "0.1.0"
description = "A tool that digests Signavio BPMN JSON and rearranges the shapes of that diagram to improve readability."
authors = [{ name = "Philipp Trofimov", email = "philipp.trofimov@sap.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "matplotlib>=3.9.2",
    "networkx>=3.4.2",
    "numpy>=2.1.3",
    "pydantic>=2.9.2",
    "scipy>=1.14.1",
    "signavio>=2.17.1",
    "dotenv>=0.9.9",
    "loguru>=0.7.2",
    "rich>=13.9.2",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.3",
    "pyyaml>=6.0.2",
]


[[tool.uv.index]]
name = "signavio"
url = "https://common.repositories.cloud.sap/artifactory/api/pypi/signavio-pypi/simple"
